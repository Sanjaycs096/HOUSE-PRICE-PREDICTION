[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "house-price-prediction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask",
  "pandas",
  "numpy==1.26.4",
  "matplotlib",
  "scikit-learn==1.7.1",
  "joblib",
  "opencv-python",
  "flask-talisman",
  "flask-limiter",
  "vercel-wsgi",
]

[tool.vercel]
entrypoint = "api.index:handler"
